name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name — set it in Settings → Secrets and variables → Actions before running this workflow."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more signing secrets are missing. Stopping before the build to save CI time."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm install

      - name: Generate app icon & splash screen
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "No assets/icon.png found — skipping icon generation, using template defaults."
          fi

      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build unsigned release AAB (for Google Play, ~10-15s extra since it reuses assembleRelease's compiled output)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Zipalign and sign APK (v2/v3 scheme)
        working-directory: android
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks app/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign AAB (jarsigner \u2014 apksigner doesn't support .aab, same keystore/alias as the APK)
        working-directory: android
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -signedjar app/build/outputs/bundle/release/app-release-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Audit final APK permissions (catches anything a plugin silently injected via manifest merge)
        working-directory: android
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "::group::Permissions actually present in the signed APK"
          "${BUILD_TOOLS}aapt" dump permissions app/build/outputs/apk/release/app-release-signed.apk
          echo "::endgroup::"

      - name: Clean up decoded keystore
        if: always()
        working-directory: android
        run: rm -f app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
