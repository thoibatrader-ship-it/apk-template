name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---- BlackUI build permit ------------------------------------------------------------
      # First step on purpose: no permit (or a fake/expired one) = stop here, before any CI time is spent.
      # The permit is created by the BlackUI server and stored as the BUILD_PERMIT secret by the dashboard.
      - name: Verify build permit with BlackUI server
        env:
          BUILD_PERMIT: ${{ secrets.BUILD_PERMIT }}
          # >>> SET THIS ONCE to your worker URL (same site as API_BASE in index.html) <<<
          VERIFY_URL: https://blackui.thoibatrader.com/api/apk/verify
        run: |
          if [[ "$VERIFY_URL" == *YOUR-PROJECT* ]]; then
            echo "::error::Template is not configured: set VERIFY_URL in .github/workflows/build-apk.yml to your BlackUI server URL."
            exit 1
          fi
          if [ -z "$BUILD_PERMIT" ]; then
            echo "::error::No build permit found. Please start the build from the BlackUI dashboard (it creates the permit for you)."
            exit 1
          fi
          # A permit only contains letters, digits, '.', '_' and '-'. Anything else is not a real permit.
          if [[ ! "$BUILD_PERMIT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::The build permit is malformed. Please start the build again from the BlackUI dashboard."
            exit 1
          fi
          status=000
          for attempt in 1 2 3 4; do
            status=$(curl -sS -o verify.json -w '%{http_code}' --max-time 20 \
              -X POST -H 'Content-Type: application/json' \
              --data "{\"permit\":\"$BUILD_PERMIT\"}" "$VERIFY_URL" || true)
            case "$status" in
              200|401|403|404) break ;;  # definitive answer from the server: do not retry
              *) echo "Permit check attempt $attempt failed (HTTP $status)."; [ "$attempt" -lt 4 ] && sleep $((attempt * 4)) ;;
            esac
          done
          if [ "$status" = "200" ] && grep -q '"valid":true' verify.json; then
            echo "Build permit verified."
          elif [ "$status" = "401" ]; then
            echo "::error::The build permit is invalid or has expired. Please start the build again from the BlackUI dashboard."
            exit 1
          else
            echo "::error::Could not verify the build permit (HTTP $status). Please try again in a few minutes."
            exit 1
          fi
          rm -f verify.json

      - uses: actions/checkout@v4

      - name: Check required secrets are set
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name — set it in Settings → Secrets and variables → Actions before running this workflow."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more signing secrets are missing. Stopping before the build to save CI time."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # Google removed the old 'tools' SDK package; the action's default ('tools platform-tools') now fails.
          packages: platform-tools

      - run: npm install

      - name: Generate app icon & splash screen
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "No assets/icon.png found — skipping icon generation, using template defaults."
          fi

      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build unsigned release AAB (for Google Play, ~10-15s extra since it reuses assembleRelease's compiled output)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Zipalign and sign APK (v2/v3 scheme)
        working-directory: android
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks app/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign AAB (jarsigner - apksigner doesn't support .aab, same keystore/alias as the APK)
        working-directory: android
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -signedjar app/build/outputs/bundle/release/app-release-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Audit final APK permissions (catches anything a plugin silently injected via manifest merge)
        working-directory: android
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "::group::Permissions actually present in the signed APK"
          "${BUILD_TOOLS}aapt" dump permissions app/build/outputs/apk/release/app-release-signed.apk
          echo "::endgroup::"

      - name: Clean up decoded keystore
        if: always()
        working-directory: android
        run: rm -f app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
